name: Events Assign Cron

on:
  workflow_dispatch: {}
  schedule:
    - cron: "*/5 * * * *"

concurrency:
  group: events-assign-cron
  cancel-in-progress: false

jobs:
  assign:
    runs-on: ubuntu-latest
    steps:
      - name: Call events assign endpoint
        shell: bash
        env:
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
          EVENTS_ASSIGN_URL: ${{ secrets.EVENTS_ASSIGN_URL }}
        run: |
          set -euo pipefail
          echo "Calling events assign endpoint..."

          RESPONSE_FILE=$(mktemp)

          HTTP_CODE=$(curl -sS --fail-with-body -o "$RESPONSE_FILE" -w "%{http_code}" -X POST \
            -H "User-Agent: GitHubActions/1.0" \
            -H "Content-Type: application/json" \
            -H "x-ingest-secret: ${INGEST_SECRET}" \
            -d '{"mode":"full","batch_size":20,"max_loops":1,"stop_when_unchanged_loops":1,"geo_backfill_limit":50,"max_age":"7 days"}' \
            "${EVENTS_ASSIGN_URL}")

          echo "HTTP $HTTP_CODE"
          cat "$RESPONSE_FILE"
