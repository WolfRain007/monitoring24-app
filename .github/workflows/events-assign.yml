name: Events Assign Cron

on:
  workflow_dispatch: {}
  schedule:
    - cron: "*/5 * * * *"

jobs:
  assign:
    runs-on: ubuntu-latest
    steps:
      - name: Call events assign endpoint
        shell: bash
        env:
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
          EVENTS_ASSIGN_URL: ${{ secrets.EVENTS_ASSIGN_URL }}
        run: |
          set -euo pipefail
          echo "Calling events assign endpoint..."

          curl --fail -sS --max-time 120 -X POST \
            -H "User-Agent: GitHubActions/1.0" \
            -H "Content-Type: application/json" \
            -H "x-ingest-secret: ${INGEST_SECRET}" \
            -d '{"mode":"assign","batch_size":50,"max_loops":1,"stop_when_unchanged_loops":1,"geo_backfill_limit":0,"max_age":"7 days"}' \
            "${EVENTS_ASSIGN_URL}" \
            | python3 -m json.tool
