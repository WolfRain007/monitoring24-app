name: RSS Ingest Cron

on:
  schedule:
    - cron: "*/5 * * * *"   # каждые 5 минут
  workflow_dispatch:       # ручной запуск

jobs:
  ingest:
    runs-on: ubuntu-latest

    steps:
      - name: Call RSS ingest endpoint
        run: |
          echo "Calling RSS ingest endpoint..."
          echo "URL: ${{ secrets.RSS_INGEST_URL }}"
          curl -v -X POST "https://monitoring24-app-xjs.vercel.app/api/rss/ingest"
