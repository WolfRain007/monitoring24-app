name: RSS Ingest Cron

on:
  schedule:
    - cron: "*/5 * * * *"   # каждые 5 минут
  workflow_dispatch:        # ручной запуск кнопкой

jobs:
  ingest:
    runs-on: ubuntu-latest

    steps:
      - name: Call RSS ingest endpoint
        run: |
          curl -X POST "${{ secrets.RSS_INGEST_URL }}"
