name: Fetch RSS content

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *" # каждые 5 минут

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      BATCH_LIMIT: "50"
      MIN_TEXT_LEN: "400"
      MIN_TEXT_LEN_RIA: "250"
      MIN_TEXT_LEN_EURONEWS: "250"
      MAX_TEXT_LEN: "60000"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install deps
        run: npm ci

      - name: Syntax check
        run: node --check scripts/fetch-rss-content.mjs

      - name: Run content fetcher
        run: node scripts/fetch-rss-content.mjs
