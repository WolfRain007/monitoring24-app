name: Generate package-lock.json
name: Generate package-lock.json

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-package-lock
  cancel-in-progress: false

jobs:
  lockfile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      # ВАЖНО: без cache, иначе setup-node падает, когда нет lock-файла
      - name: Setup Node.js (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate package-lock.json (npm install)
        run: |
          npm install --no-audit --no-fund

      - name: Show lockfile status
        run: |
