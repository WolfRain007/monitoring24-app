name: Generate package-lock.json

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-package-lock
  cancel-in-progress: false

jobs:
  lockfile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Generate package-lock.json (npm install)
        run: |
          npm install --no-audit --no-fund

      - name: Show lockfile status
        run: |
          ls -la package-lock.json || true
          git status

      - name: Commit and push package-lock.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add package-lock.json package.json

          # если изменений нет — выходим успешно
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore: generate package-lock.json"
          git push
